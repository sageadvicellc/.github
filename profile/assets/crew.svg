<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t">
<title id="t">The crew: a founder, a workforce orchestrator and seven roles, coloured by department. Dashed boxes are planned roles.</title>
<style>
:root{--fg:#1F2328;--muted:#57606A;--card:#F6F8FA;--line:#D0D7DE;--node:#FFFFFF;--leadership:#7C3AED;--engineering:#0969DA;--delivery:#BF8700;--research:#1A7F37;}
@media (prefers-color-scheme:dark){:root{--fg:#E6EDF3;--muted:#8B949E;--card:#161B22;--line:#30363D;--node:#0D1117;--leadership:#A78BFA;--engineering:#58A6FF;--delivery:#D29922;--research:#3FB950;}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.muted{fill:var(--muted)}

.edge{stroke:var(--line);stroke-width:2;fill:none;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease-out both}
.node rect{fill:var(--node);stroke-width:2}
.planned rect{stroke-dasharray:5 4}
.node{animation:pop .5s cubic-bezier(.23,1,.32,1) both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.edge,.node{animation:none}.edge{stroke-dashoffset:0}}
</style>
<path class="edge" pathLength="1" d="M320 58 V350"/>
<path class="edge" pathLength="1" style="animation-delay:0.30s" d="M320 170 H248.0"/>
<path class="edge" pathLength="1" style="animation-delay:0.38s" d="M320 170 H432.5"/>
<path class="edge" pathLength="1" style="animation-delay:0.46s" d="M320 230 H239.0"/>
<path class="edge" pathLength="1" style="animation-delay:0.54s" d="M320 230 H450.5"/>
<path class="edge" pathLength="1" style="animation-delay:0.62s" d="M320 290 H203.0"/>
<path class="edge" pathLength="1" style="animation-delay:0.70s" d="M320 290 H419.0"/>
<path class="edge" pathLength="1" style="animation-delay:0.78s" d="M320 350 H194.0"/>
<g class="node" style="animation-delay:0.00s"><rect x="276" y="14" width="87" height="44" rx="8" style="stroke:var(--leadership)"/><text x="320" y="41" font-size="15" text-anchor="middle">Founder</text></g>
<g class="node planned" style="animation-delay:0.08s"><rect x="209" y="78" width="222" height="44" rx="8" style="stroke:var(--leadership)"/><text x="320" y="105" font-size="15" text-anchor="middle">Workforce Orchestrator</text></g>
<g class="node planned" style="animation-delay:0.16s"><rect x="62" y="148" width="186" height="44" rx="8" style="stroke:var(--leadership)"/><text x="155" y="175" font-size="15" text-anchor="middle">Personal Assistant</text></g>
<g class="node planned" style="animation-delay:0.24s"><rect x="432" y="148" width="105" height="44" rx="8" style="stroke:var(--engineering)"/><text x="485" y="175" font-size="15" text-anchor="middle">Tech Lead</text></g>
<g class="node planned" style="animation-delay:0.32s"><rect x="71" y="208" width="168" height="44" rx="8" style="stroke:var(--delivery)"/><text x="155" y="235" font-size="15" text-anchor="middle">Delivery Manager</text></g>
<g class="node" style="animation-delay:0.40s"><rect x="450" y="208" width="69" height="44" rx="8" style="stroke:var(--leadership)"/><text x="485" y="235" font-size="15" text-anchor="middle">Pixel</text></g>
<g class="node" style="animation-delay:0.48s"><rect x="107" y="268" width="96" height="44" rx="8" style="stroke:var(--research)"/><text x="155" y="295" font-size="15" text-anchor="middle">Research</text></g>
<g class="node planned" style="animation-delay:0.56s"><rect x="419" y="268" width="132" height="44" rx="8" style="stroke:var(--research)"/><text x="485" y="295" font-size="15" text-anchor="middle">Benchmarking</text></g>
<g class="node" style="animation-delay:0.64s"><rect x="116" y="328" width="78" height="44" rx="8" style="stroke:var(--engineering)"/><text x="155" y="355" font-size="15" text-anchor="middle">Worker</text></g>
</svg>
