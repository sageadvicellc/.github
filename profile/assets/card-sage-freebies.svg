<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" role="img" aria-labelledby="t">
<title id="t">sage-freebies: Free tools and files, given away.</title>
<style>
:root{--ink:#163D26;--fg:#163D26;--muted:#57606A;--card:#F6F8FA;--line:#D0D7DE;--node:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--ink:#E6EDF3;--fg:#E6EDF3;--muted:#8B949E;--card:#161B22;--line:#30363D;--node:#0D1117}}
.ink{fill:var(--ink)}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.muted{fill:var(--muted)}

.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.bar{fill:var(--ink);transform-box:fill-box;transform-origin:0 50%;animation:grow .7s cubic-bezier(.23,1,.32,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.bar{animation:none}}
</style>
<rect class="card" x="1" y="1" width="398" height="148" rx="10"/>
<rect class="bar" x="24" y="26" width="36" height="4" rx="2"/>
<text x="24" y="62" font-size="22" font-weight="600">sage-freebies</text>
<text class="muted" x="24" y="90" font-size="14">Free tools and files,</text>
<text class="muted" x="24" y="110" font-size="14">given away.</text>
<text class="muted" x="24" y="134" font-size="12">Public repository</text>
</svg>
